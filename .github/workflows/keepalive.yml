# Authors: Meekaaeel Booley, Mubashir Dawood, Zubair Elliot

# Free Spaces sleep after ~48h without traffic; a daily ping keeps the demo warm.
name: Keep API warm

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.API_URL != ''
    steps:
      - run: curl -fsS --retry 5 --retry-delay 30 --retry-all-errors "${{ vars.API_URL }}/api/health"
