<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Paste text or upload a document to see how likely it is to be AI-generated, sentence by sentence." />
    <meta property="og:title" content="AI Content Detector" />
    <meta property="og:description" content="Sentence-level AI text detection with a fine-tuned RoBERTa model." />
    <meta property="og:type" content="website" />
    <title>AI Content Detector</title>
    <script>
      try {
        const t = localStorage.getItem("aicd-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
