<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Paste text or upload a document to see how likely it is to be AI-generated, sentence by sentence." />
    <meta property="og:title" content="AI Content Detector" />
    <meta property="og:description" content="Sentence-level AI text detection with a fine-tuned RoBERTa model." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://aicd-nine.vercel.app/og.png" />
    <meta property="og:image:alt" content="AI-CD home page: paste text, see which sentences read as AI or human." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>AI Content Detector</title>
    <script>
      try {
        const t = localStorage.getItem("aicd-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
